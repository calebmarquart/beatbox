name: Build ESP32 firmware

on:
  push:
    paths:
      - "esp32/**"
      - ".github/workflows/build-esp32.yml"
  pull_request:
    paths:
      - "esp32/**"
      - ".github/workflows/build-esp32.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # espup (used by the Xtensa toolchain action) queries the GitHub API;
  # a token avoids rate-limit errors
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

defaults:
  run:
    working-directory: esp32/beatbox

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          default: true
          buildtargets: esp32
          ldproxy: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: esp32/beatbox

      - name: Build (release)
        run: cargo build --release --locked

      - name: Upload firmware ELF
        uses: actions/upload-artifact@v4
        with:
          name: beatbox-elf
          path: esp32/beatbox/target/xtensa-esp32-none-elf/release/beatbox